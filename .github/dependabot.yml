version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"

  # Maintain dependencies for the website
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      # Check for updates to website dependencies every week
      interval: "weekly"
