name: Dev shell bootstrap

# Not a required check. scripts/dev-windows.cmd and scripts/dev-windows.ps1 set
# up the Visual Studio developer shell for local builds, and no other job runs
# them, so they kept probing only Visual Studio 2022 paths after the hosted
# windows-2025 image moved to Visual Studio 2026 (version 18). This runs both on
# an image with each version and on ARM64: first through vswhere, then through
# the default install paths with vswhere out of reach (fake installs under
# RUNNER_TEMP whose VsDevCmd.bat fails on purpose, one of them a leftover with
# no C++ tools), and with nothing installed.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/dev-windows.cmd'
      - 'scripts/dev-windows.ps1'
      - '.github/workflows/dev-shell.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Dev shell on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            vs: '18'
          - os: windows-2022
            vs: '2022'
          - os: windows-11-arm
            vs: '18|2022'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      # Each script must name the VsDevCmd.bat it found. Through vswhere that is
      # the image's own install, and the dev shell must then run cl and the
      # command it was given. Without vswhere (ProgramW6432 too: Windows sets a
      # 64-bit child's ProgramFiles from it) it is the newest default install
      # path with an MSVC toolset, and a failing VsDevCmd.bat must fail the
      # script. With nothing usable installed the script must say so and fail.
      - name: Check the dev shell bootstrap scripts
        shell: pwsh
        env:
          EXPECTED_VS: ${{ matrix.vs }}
        run: |
          $cmdScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\dev-windows.cmd'
          $psScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\dev-windows.ps1'
          $powershell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Host "Image $env:ImageOS $env:ImageVersion, $env:PROCESSOR_ARCHITECTURE; Visual Studio instances:"
          & $vswhere -all -products * -property installationPath
          $bootstraps = [ordered]@{
            'dev-windows.cmd zig version' = { & $cmdScript zig version }
            'dev-windows.ps1 under PowerShell 7' = { & pwsh -NoProfile -NonInteractive -File $psScript }
            'dev-windows.ps1 under Windows PowerShell 5.1' = { & $powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $psScript }
          }
          function Invoke-Bootstrap([string] $Label, [scriptblock] $Run) {
            Write-Host "::group::$Label"
            $ErrorActionPreference = 'Continue'
            $output = @(& $Run 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            Write-Host "exit $code"
            Write-Host '::endgroup::'
            $named = @($output | ForEach-Object { if ($_ -match '^VS Dev shell: "(.+)"$') { $Matches[1] } }) | Select-Object -First 1
            return [pscustomobject]@{ Exit = $code; Output = $output; VsDevCmd = $named }
          }

          $installed = '\\Microsoft Visual Studio\\(?:' + $env:EXPECTED_VS + ')\\[^\\]+\\Common7\\Tools\\VsDevCmd\.bat$'
          foreach ($label in $bootstraps.Keys) {
            $r = Invoke-Bootstrap $label $bootstraps[$label]
            if ($r.Exit -ne 0) { throw "$label exited $($r.Exit)." }
            if ($r.VsDevCmd -notmatch $installed -or -not (Test-Path -LiteralPath $r.VsDevCmd)) { throw "$label named '$($r.VsDevCmd)', not the image's Visual Studio $env:EXPECTED_VS." }
            if (-not ($r.Output -match 'C/C\+\+ Optimizing Compiler Version')) { throw "$label did not reach cl." }
            if ($label -like '*.cmd*' -and $r.Output[-1] -notmatch '^0\.15\.') { throw "$label did not run zig version in the dev shell: '$($r.Output[-1])'." }
            "${label}: $($r.VsDevCmd)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          # dev-windows.ps1 writes its bootstrap under the temp folder and has cmd.exe run it.
          # A temp folder whose name holds cmd's special characters (a profile named A&B) must
          # not split that path: before the fix the ampersand started a new command. No
          # parentheses: VsDevCmd.bat itself fails with a ')' in TEMP ("...\dd_vsdevcmd17_
          # preinit_env.log was unexpected at this time", measured 10-25), whatever we pass it.
          $oddTemp = Join-Path $env:RUNNER_TEMP 'dev shell A&B ^x'
          New-Item -ItemType Directory -Force -Path $oddTemp | Out-Null
          $savedTemp = @{ TEMP = $env:TEMP; TMP = $env:TMP }
          $env:TEMP = $oddTemp
          $env:TMP = $oddTemp
          try {
            foreach ($label in @($bootstraps.Keys | Where-Object { $_ -like 'dev-windows.ps1*' })) {
              $oddRun = Invoke-Bootstrap "$label, temp folder '$oddTemp'" $bootstraps[$label]
              if ($oddRun.Exit -ne 0) { throw "$label with the temp folder '$oddTemp' exited $($oddRun.Exit)." }
              if ($oddRun.VsDevCmd -notmatch $installed) { throw "$label with the temp folder '$oddTemp' named '$($oddRun.VsDevCmd)'." }
              if (-not ($oddRun.Output -match 'C/C\+\+ Optimizing Compiler Version')) { throw "$label with the temp folder '$oddTemp' did not reach cl." }
              # The bootstrap names itself, so a script that stopped writing it under TEMP cannot pass here.
              $ranFrom = @($oddRun.Output | ForEach-Object { if ($_ -match '^Bootstrap: "(.+)"$') { $Matches[1] } }) | Select-Object -First 1
              if (-not $ranFrom -or -not $ranFrom.StartsWith($oddTemp + '\', [System.StringComparison]::OrdinalIgnoreCase)) { throw "$label ran its bootstrap from '$ranFrom', not from inside '$oddTemp'." }
              if (@(Get-ChildItem -LiteralPath $oddTemp -Filter 'noctty-dev-windows-*.cmd').Count -ne 0) { throw "$label left its bootstrap file in '$oddTemp'." }
            }
          } finally {
            $env:TEMP = $savedTemp.TEMP
            $env:TMP = $savedTemp.TMP
          }
          # The default-path fallback reads VC\Tools\MSVC\<version>\lib\<arch>; show the real layout.
          $install = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $r.VsDevCmd))
          foreach ($toolset in @(Get-ChildItem -LiteralPath (Join-Path $install 'VC\Tools\MSVC') -Directory)) {
            Write-Host "MSVC $($toolset.Name) lib: $((Get-ChildItem -LiteralPath (Join-Path $toolset.FullName 'lib') -Directory).Name -join ', ')"
          }

          # An install is VsDevCmd.bat plus, unless it is a leftover, an MSVC toolset with
          # libraries for the architectures in Tools (both unless given). Each is a hashtable:
          # @(@('a', 'b')) would unroll to the two strings.
          function New-FakeInstall([string] $Root, $Install) {
            $folder = Join-Path $Root "$($Install.Root)\Microsoft Visual Studio\$($Install.Version)\$($Install.Edition)"
            New-Item -ItemType Directory -Force -Path (Join-Path $folder 'Common7\Tools') | Out-Null
            $tools = if ($Install.Leftover) { @() } elseif ($Install.Tools) { @($Install.Tools) } else { @('x64', 'arm64') }
            foreach ($arch in $tools) { New-Item -ItemType Directory -Force -Path (Join-Path $folder "VC\Tools\MSVC\14.50.0\lib\$arch") | Out-Null }
            Set-Content -LiteralPath (Join-Path $folder 'Common7\Tools\VsDevCmd.bat') -Value "@echo fake VsDevCmd %*`r`n@exit /b 7`r`n" -NoNewline
          }
          $cases = @(
            @{ Name = 'only 18'; Expect = 'pf\Microsoft Visual Studio\18\BuildTools'; Installs = @(
                @{ Root = 'pf'; Version = '18'; Edition = 'BuildTools' }) }
            @{ Name = 'only 2022 in Program Files (x86)'; Expect = 'pf (x86)\Microsoft Visual Studio\2022\BuildTools'; Installs = @(
                @{ Root = 'pf (x86)'; Version = '2022'; Edition = 'BuildTools' }) }
            @{ Name = '18 and 2022'; Expect = 'pf\Microsoft Visual Studio\18\Community'; Installs = @(
                @{ Root = 'pf'; Version = '2022'; Edition = 'Enterprise' }
                @{ Root = 'pf'; Version = '18'; Edition = 'Community' }) }
            @{ Name = 'a leftover 18 without tools and a 2022'; Expect = 'pf\Microsoft Visual Studio\2022\Community'; Installs = @(
                @{ Root = 'pf'; Version = '18'; Edition = 'Community'; Leftover = $true }
                @{ Root = 'pf'; Version = '2022'; Edition = 'Community' }) }
            @{ Name = 'only a leftover without tools'; Expect = $null; Installs = @(
                @{ Root = 'pf'; Version = '2022'; Edition = 'Community'; Leftover = $true }) }
            @{ Name = 'arm64 asked, 18 has x64 tools and 2022 arm64'; Arch = 'arm64'; Expect = 'pf\Microsoft Visual Studio\2022\Community'; Installs = @(
                @{ Root = 'pf'; Version = '18'; Edition = 'Community'; Tools = @('x64') }
                @{ Root = 'pf'; Version = '2022'; Edition = 'Community'; Tools = @('arm64') }) }
            @{ Name = 'x64 asked, 18 has x64 tools and 2022 arm64'; Arch = 'x64'; Expect = 'pf\Microsoft Visual Studio\18\Community'; Installs = @(
                @{ Root = 'pf'; Version = '18'; Edition = 'Community'; Tools = @('x64') }
                @{ Root = 'pf'; Version = '2022'; Edition = 'Community'; Tools = @('arm64') }) }
            @{ Name = 'nothing'; Expect = $null; Installs = @() }
          )
          $saved = @{ ProgramFiles = $env:ProgramFiles; ProgramW6432 = $env:ProgramW6432; 'ProgramFiles(x86)' = ${env:ProgramFiles(x86)}; DEV_WINDOWS_ARCH = $env:DEV_WINDOWS_ARCH }
          foreach ($case in $cases) {
            $base = Join-Path $env:RUNNER_TEMP ('dev-shell-' + ($case.Name -replace '\W', '-'))
            New-Item -ItemType Directory -Force -Path (Join-Path $base 'pf'), (Join-Path $base 'pf (x86)') | Out-Null
            foreach ($install in $case.Installs) { New-FakeInstall $base $install }
            $missing = @($case.Installs | ForEach-Object { Join-Path $base "$($_.Root)\Microsoft Visual Studio\$($_.Version)\$($_.Edition)\Common7\Tools\VsDevCmd.bat" } | Where-Object { -not (Test-Path -LiteralPath $_) })
            if ($missing.Count -ne 0) { throw "$($case.Name): the fake install was not made: $($missing -join ', ')" }
            try {
              $env:ProgramFiles = Join-Path $base 'pf'
              $env:ProgramW6432 = $env:ProgramFiles
              ${env:ProgramFiles(x86)} = Join-Path $base 'pf (x86)'
              if ($case.Arch) { $env:DEV_WINDOWS_ARCH = $case.Arch }
              $seen = (& cmd.exe /d /c 'echo %ProgramFiles%^|%ProgramFiles(x86)%') -join ''
              if ($seen -cne "$(Join-Path $base 'pf')|$(Join-Path $base 'pf (x86)')") { throw "cmd sees '$seen', not the fake roots." }
              foreach ($label in $bootstraps.Keys) {
                $r = Invoke-Bootstrap "$label, $($case.Name)" $bootstraps[$label]
                if ($r.Exit -eq 0) { throw "$label, $($case.Name): exit 0." }
                if ($case.Expect) {
                  $arch = if ($case.Arch) { $case.Arch } elseif ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
                  if ($r.VsDevCmd -cne (Join-Path $base "$($case.Expect)\Common7\Tools\VsDevCmd.bat") -or -not ($r.Output -match "^fake VsDevCmd -arch=$arch$")) {
                    throw "$label, $($case.Name): named '$($r.VsDevCmd)', expected $($case.Expect)."
                  }
                } elseif ($r.VsDevCmd -or -not ($r.Output -match 'Missing VS Dev shell bootstrap')) {
                  throw "$label, $($case.Name): did not report the missing Visual Studio."
                }
              }
            } finally {
              foreach ($name in $saved.Keys) { [Environment]::SetEnvironmentVariable($name, $saved[$name]) }
            }
          }
          # The runner's wrapper ends the step with `exit $LASTEXITCODE`, which the last
          # expected failure above would otherwise set.
          exit 0
