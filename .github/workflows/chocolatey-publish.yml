name: Chocolatey Publish

# Pushes the Chocolatey package for a version that is already on the GitHub
# release page, from a hosted runner and without building anything. Rerunning
# the Release workflow cannot do this: it rebuilds the installers and replaces
# the published assets. docs/chocolatey-publishing.md explains when to run it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release to package, without a leading v, such as 1.3.132
        required: true
        type: string
      push:
        description: Push to chocolatey.org. Leave off for a dry run that verifies the release and packs the package but stops before choco push.
        required: false
        default: false
        type: boolean
      resubmit:
        description: Push even though chocolatey.org already lists the version, to send a corrected package for a version still in moderation. Without it a listed version is skipped.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  chocolatey-publish:
    name: Chocolatey Publish
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The package names this commit as its source, so it has to be the head
      # of the default branch, as for a release.
      - name: Check the version and the workflow commit
        id: meta
        env:
          GH_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ($env:GH_REPOSITORY -cne 'amanthanvi/noctty') {
            throw 'Chocolatey publishing is restricted to amanthanvi/noctty.'
          }
          if ($env:WORKFLOW_REF -cne "refs/heads/$env:DEFAULT_BRANCH") {
            throw "Run this workflow from $env:DEFAULT_BRANCH, not $env:WORKFLOW_REF."
          }
          if ($env:VERSION_INPUT -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw 'The version must be plain three-part semver such as 1.3.132, without a leading v.'
          }
          git fetch origin $env:DEFAULT_BRANCH --no-tags --depth=1
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch origin/$env:DEFAULT_BRANCH." }
          $head = (git rev-parse HEAD).Trim()
          $defaultHead = (git rev-parse "origin/$env:DEFAULT_BRANCH").Trim()
          if ($head -ne $env:WORKFLOW_SHA -or $head -ne $defaultHead) {
            throw "Workflow commit $head is not remote default-branch head $defaultHead."
          }
          "version=$env:VERSION_INPUT" >> $env:GITHUB_OUTPUT

      - name: Show the Chocolatey version
        shell: pwsh
        run: |
          choco --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Downloads the release, verifies every asset (GitHub digest, SHA256SUMS,
      # build provenance, Authenticode signer), then builds the package from
      # the installers it just verified. Nothing here can reach the API key.
      - name: Verify the published release and build the package
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CODESIGN_TRUST_SELF_SIGNED: ${{ vars.WINDOWS_CODESIGN_TRUST_SELF_SIGNED }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE_SOURCE_REF: ${{ github.sha }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./scripts/release-stage-published.ps1 `
            -Version $env:RELEASE_VERSION `
            -DownloadDirectory (Join-Path $env:RUNNER_TEMP 'published-release') `
            -PackageSourceRef $env:PACKAGE_SOURCE_REF

      - name: Pack the package (dry run)
        if: ${{ !inputs.push }}
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: pwsh
        run: ./scripts/release-publish-chocolatey.ps1 -Version $env:RELEASE_VERSION -PackOnly

      - name: Push to Chocolatey
        if: ${{ inputs.push }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RESUBMIT: ${{ inputs.resubmit }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            throw 'The release environment has no CHOCO_API_KEY secret.'
          }
          $publishArguments = @{ Version = $env:RELEASE_VERSION; Resubmit = ($env:RESUBMIT -ceq 'true') }
          ./scripts/release-publish-chocolatey.ps1 @publishArguments
