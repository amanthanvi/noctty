name: Deploy Site

# The site names the latest release and links its downloads, so production
# takes a release copy only once GitHub has published that release. Merging
# the release-copy PR runs this workflow while the release is still unpublished;
# the release-copy job then holds the deploy. The Release workflow publishes
# with GITHUB_TOKEN, and an event made with GITHUB_TOKEN starts no workflow
# run, so `release: published` fires only for a release a person publishes. The
# Release run's completion (`workflow_run`) deploys the held copy. Both of
# those events deploy the default branch, never the triggering run's commit or
# artifacts.
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  release-copy:
    name: Hold a release copy until its release is published
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      published: ${{ steps.published.outputs.published }}

    steps:
      - name: Checkout the deployment README
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && github.event.repository.default_branch || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false

      # README.md carries the release copy's version: update-release-copy.ps1
      # writes it and check-release-copy.ps1 checks the rest of the copy
      # against it. Only a copy newer than GitHub's latest release is held
      # (published=false). The deploy job skips on that answer alone, so any
      # other mismatch, or no answer, reaches its release copy check, which
      # fails the run.
      - name: Compare the release copy with the latest published release
        id: published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $readme = Get-Content -LiteralPath README.md -Raw
          $copy = [regex]::Match($readme, 'noctty\s+([0-9]+\.[0-9]+\.[0-9]+)\]\(https://github\.com/amanthanvi/noctty/releases/tag/v\1\)')
          if (-not $copy.Success) {
            throw 'README.md names no self-consistent latest stable release.'
          }
          $tag = gh release view --repo amanthanvi/noctty --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the latest GitHub release.'
          }
          $tag = ([string]($tag -join "`n")).Trim()
          $latest = [regex]::Match($tag, '^v([0-9]+\.[0-9]+\.[0-9]+)$')
          if (-not $latest.Success) {
            throw "The latest GitHub release tag is not plain semver: $tag"
          }
          $copyVersion = [version]$copy.Groups[1].Value
          $latestVersion = [version]$latest.Groups[1].Value
          $published = $copyVersion -le $latestVersion
          if (-not $published) {
            $message = "README.md names v$copyVersion and the latest GitHub release is v$latestVersion, so production keeps the published copy. The Release run that publishes v$copyVersion deploys this one when it completes."
            Write-Output "::notice title=Site deploy held::$message"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Site deploy held`n`n$message"
          }
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  deploy:
    name: Canary, verify, and publish
    needs: release-copy
    if: needs.release-copy.outputs.published != 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: cloudflare-pages-production
    env:
      CLOUDFLARE_PAGES_PROJECT: noctty
      CLOUDFLARE_PAGES_PRODUCTION_BRANCH: main

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && github.event.repository.default_branch || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact deployment commit
        id: source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve the deployment source SHA.'
          }
          $sha = ([string]($sha -join "`n")).Trim()
          if ($sha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Deployment source did not resolve to a full Git SHA.'
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      # One check per step. A pwsh step ends with
      # `if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }`,
      # which fails it on a script's `exit 1`. Never follow a passing PowerShell
      # script with `if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }`: a script
      # that runs no native command leaves $LASTEXITCODE $null, and `exit $null`
      # ends the step successfully before the checks after it run.
      - name: Site copy checks
        shell: pwsh
        run: ./scripts/check-site-copy.ps1

      - name: Deterministic site asset check
        shell: pwsh
        run: node scripts/build-site-assets.mjs --check

      - name: Site header contract
        shell: pwsh
        run: ./scripts/get-site-header-contract.ps1 | Out-Null

      - name: Release copy matches the latest published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            if ($env:RELEASE_TAG -cnotmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw 'Published release tag must be plain v<major>.<minor>.<patch> semver.'
            }
            ./scripts/check-release-copy.ps1 `
              -ExpectedVersion $Matches.version `
              -CheckRemoteLatest
          } else {
            ./scripts/check-release-copy.ps1 -CheckRemoteLatest
          }

      - name: Build deterministic deploy payload twice
        id: payload
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "noctty-site-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $first = Join-Path $root 'payload'
          $second = Join-Path $root 'payload-repeat'
          $firstManifest = Join-Path $root 'payload.sha256'
          $secondManifest = Join-Path $root 'payload-repeat.sha256'
          $evidence = Join-Path $env:RUNNER_TEMP "noctty-site-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $wrangler = Join-Path $env:RUNNER_TEMP "noctty-wrangler-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          ./scripts/build-site-payload.ps1 -OutputDirectory $first -ManifestPath $firstManifest
          ./scripts/build-site-payload.ps1 -OutputDirectory $second -ManifestPath $secondManifest

          $firstBytes = [IO.File]::ReadAllBytes($firstManifest)
          $secondBytes = [IO.File]::ReadAllBytes($secondManifest)
          if (-not [Linq.Enumerable]::SequenceEqual[byte]($firstBytes, $secondBytes)) {
            throw 'Repeated site builds produced different sorted SHA-256 manifests.'
          }

          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path $wrangler -Force | Out-Null
          Copy-Item -LiteralPath $firstManifest -Destination (Join-Path $evidence 'payload.sha256')
          "directory=$($first.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          "manifest=$($firstManifest.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          "evidence_directory=$($evidence.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          "wrangler_directory=$($wrangler.Replace('\', '/'))" >> $env:GITHUB_OUTPUT

      - name: Require exact origin main before canary
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          ./scripts/require-site-deployment-head.ps1 `
            -ExpectedSha $env:DEPLOY_SHA `
            -DefaultBranch $env:DEFAULT_BRANCH `
            -Phase canary

      - name: Resolve canary branch
        id: canary_meta
        shell: pwsh
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $sha = $env:DEPLOY_SHA
          $branch = "canary-$($sha.Substring(0, 12))-$env:GITHUB_RUN_ATTEMPT"
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Deploy exact payload to canary
        id: canary
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.114.0
          packageManager: npm
          workingDirectory: ${{ steps.payload.outputs.wrangler_directory }}
          command: >-
            pages deploy "${{ steps.payload.outputs.directory }}"
            --project-name=noctty
            --branch="${{ steps.canary_meta.outputs.branch }}"
            --commit-hash="${{ steps.source.outputs.sha }}"
            --commit-dirty=false

      - name: Verify canary provenance and bytes
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_ID: ${{ steps.canary.outputs.pages-deployment-id }}
          DEPLOYMENT_URL: ${{ steps.canary.outputs.deployment-url }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          CANARY_BRANCH: ${{ steps.canary_meta.outputs.branch }}
          PAYLOAD_DIRECTORY: ${{ steps.payload.outputs.directory }}
          PAYLOAD_MANIFEST: ${{ steps.payload.outputs.manifest }}
          PROVENANCE_DIRECTORY: ${{ steps.payload.outputs.evidence_directory }}
        run: |
          $provenancePath = Join-Path $env:PROVENANCE_DIRECTORY 'canary-provenance.json'
          ./scripts/verify-cloudflare-pages.ps1 `
            -Mode Deployment `
            -DeploymentId $env:DEPLOYMENT_ID `
            -ExpectedEnvironment preview `
            -ExpectedBranch $env:CANARY_BRANCH `
            -ExpectedCommit $env:DEPLOY_SHA `
            -BaseUrl $env:DEPLOYMENT_URL `
            -PayloadDirectory $env:PAYLOAD_DIRECTORY `
            -ManifestPath $env:PAYLOAD_MANIFEST `
            -ProvenancePath $provenancePath

      - name: Require the zone-owned www redirect before production
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_ID: ${{ steps.canary.outputs.pages-deployment-id }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          ./scripts/verify-cloudflare-pages.ps1 `
            -Mode Redirect `
            -DeploymentId $env:DEPLOYMENT_ID `
            -ExpectedCommit $env:DEPLOY_SHA

      - name: Require exact origin main before production
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          ./scripts/require-site-deployment-head.ps1 `
            -ExpectedSha $env:DEPLOY_SHA `
            -DefaultBranch $env:DEFAULT_BRANCH `
            -Phase production

      - name: Deploy identical payload to production
        id: production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.114.0
          packageManager: npm
          workingDirectory: ${{ steps.payload.outputs.wrangler_directory }}
          command: >-
            pages deploy "${{ steps.payload.outputs.directory }}"
            --project-name=noctty
            --branch=main
            --commit-hash="${{ steps.source.outputs.sha }}"
            --commit-dirty=false

      - name: Verify production provenance, domain, and bytes
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_ID: ${{ steps.production.outputs.pages-deployment-id }}
          DEPLOYMENT_URL: ${{ steps.production.outputs.deployment-url }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          PAYLOAD_DIRECTORY: ${{ steps.payload.outputs.directory }}
          PAYLOAD_MANIFEST: ${{ steps.payload.outputs.manifest }}
          PROVENANCE_DIRECTORY: ${{ steps.payload.outputs.evidence_directory }}
        run: |
          $provenancePath = Join-Path $env:PROVENANCE_DIRECTORY 'production-provenance.json'
          ./scripts/verify-cloudflare-pages.ps1 `
            -Mode Deployment `
            -DeploymentId $env:DEPLOYMENT_ID `
            -ExpectedEnvironment production `
            -ExpectedBranch main `
            -ExpectedCommit $env:DEPLOY_SHA `
            -BaseUrl $env:DEPLOYMENT_URL `
            -CanonicalBaseUrl 'https://noctty.com/' `
            -PayloadDirectory $env:PAYLOAD_DIRECTORY `
            -ManifestPath $env:PAYLOAD_MANIFEST `
            -ProvenancePath $provenancePath `
            -RequireCanonical `
            -VerifyWwwRedirect

      - name: Upload redacted deployment provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-deployment-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noctty-site-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30
