name: Windows ARM64

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

# The Zig test suite and the package build were one serial job of about 30
# minutes. They do not depend on each other, so they run side by side, and a pull
# request that changes neither (docs, site, release or check scripts) runs
# neither: `changes` applies the same path table as test.yml
# (scripts/ci-changed-paths.ps1). A job skipped by an `if:` reports success, and
# the gate job `native-arm64` keeps the old job's id and name, so it is the one
# check to require, and it fails on a needed job that did not succeed.
jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arm64_tests: ${{ steps.filter.outputs.arm64_tests }}
      arm64_build: ${{ steps.filter.outputs.arm64_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs the merge base.
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Decide which jobs the change needs
        id: filter
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci-changed-paths.ps1 -EventName $env:EVENT_NAME -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

  arm64-tests:
    name: Native Windows ARM64 Zig Tests
    needs: changes
    if: needs.changes.outputs.arm64_tests == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      # Reuse only verified dependency packages, never compiler/build outputs.
      - name: Cache Zig dependency packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.zig-global-cache/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.15.2-${{ github.job }}-packages-v1-${{ hashFiles('build.zig.zon', 'pkg/**/build.zig.zon') }}

      - name: Configure Zig cache directories
        shell: pwsh
        run: |
          $globalCache = Join-Path $env:GITHUB_WORKSPACE ".zig-global-cache"
          $localCache = Join-Path $env:GITHUB_WORKSPACE ".zig-cache-arm64"
          New-Item -ItemType Directory -Force -Path $globalCache, $localCache | Out-Null
          "ZIG_GLOBAL_CACHE_DIR=$globalCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIG_LOCAL_CACHE_DIR=$localCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"
          Write-Host "Process architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          zig version
          zig env

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Expected a native Windows ARM64 runner, got PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE."
          }

      - name: Run ARM64 Zig tests
        shell: pwsh
        # The four -Dtest-filter=<one token> commands this replaces each ran 0
        # tests (src/main.zig has since been fixed so a filter runs what it
        # matches), so this job reported ARM64 coverage it never had. A filter
        # is still only a subset; the full suite is what this job should run.
        # -Dtest-shards=4 runs it as four processes on the runner's four cores
        # (src/test_runner.zig), as test.yml's Full Zig test suite does.
        run: |
          zig build test -Demit-test-exe=true -Dcustom-shaders=true -Dtarget=aarch64-windows-msvc -Dcpu=baseline -Dtest-shards=4 --summary all

  arm64-build:
    name: Native Windows ARM64 Build
    needs: changes
    if: needs.changes.outputs.arm64_build == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NOCTTY_CI_VERSION: 0.0.1
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      # Reuse only verified dependency packages, never compiler/build outputs.
      - name: Cache Zig dependency packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.zig-global-cache/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.15.2-${{ github.job }}-packages-v1-${{ hashFiles('build.zig.zon', 'pkg/**/build.zig.zon') }}

      - name: Configure Zig cache directories
        shell: pwsh
        run: |
          $globalCache = Join-Path $env:GITHUB_WORKSPACE ".zig-global-cache"
          $localCache = Join-Path $env:GITHUB_WORKSPACE ".zig-cache-arm64"
          New-Item -ItemType Directory -Force -Path $globalCache, $localCache | Out-Null
          "ZIG_GLOBAL_CACHE_DIR=$globalCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIG_LOCAL_CACHE_DIR=$localCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"
          Write-Host "Process architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          zig version
          zig env

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Expected a native Windows ARM64 runner, got PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE."
          }

      - name: Build and package ARM64 binaries
        shell: pwsh
        timeout-minutes: 45
        run: >
          ./scripts/build-package-windows.ps1
          -Version $env:NOCTTY_CI_VERSION
          -Architecture arm64
          -Optimize ReleaseFast
          -RequireSymbols

      - name: Verify lazy OpenGL import contract
        shell: pwsh
        run: ./test/windows/cli-import-contract.ps1 -BinDirectory ./zig-out/bin

      - name: Run ARM64 CLI smoke
        shell: pwsh
        run: |
          $versionText = & .\zig-out\bin\noctty.com +version | Out-String
          Write-Host $versionText
          if ($versionText -notmatch "Build Config") {
            throw "noctty.com +version did not print the expected version output."
          }
          if ($versionText -notmatch "custom shaders: enabled") {
            throw "noctty.com +version did not report custom shader support."
          }

      - name: Build ARM64 D3D11 smoke tools
        shell: pwsh
        timeout-minutes: 20
        run: zig build -Doptimize=ReleaseFast -Dcustom-shaders=true -Dd3d11=true -Drenderer-test-tools=true -Dtarget=aarch64-windows-msvc -Dcpu=baseline --prefix renderer-smoke --summary all

      - name: Hidden-desktop ARM64 WARP lifecycle smoke
        shell: pwsh
        timeout-minutes: 10
        run: ./test/windows/renderer/Invoke-RendererParity.ps1 -Binary ./renderer-smoke/bin/noctty.exe -OutputDirectory ./renderer-smoke/evidence -WarpOnly

      - name: Upload ARM64 renderer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-arm64-${{ github.run_id }}
          path: renderer-smoke/evidence
          if-no-files-found: ignore

      - name: Run packaged ARM64 CLI smoke
        shell: pwsh
        run: |
          $portableRoot = Join-Path $PWD "dist/artifacts/noctty-$env:NOCTTY_CI_VERSION-windows-arm64/noctty"
          $portableCommand = Join-Path $portableRoot "noctty.com"
          if (-not (Test-Path -LiteralPath $portableCommand)) {
            throw "Missing packaged ARM64 command shim: $portableCommand"
          }

          $versionText = & $portableCommand +version | Out-String
          Write-Host $versionText
          if ($versionText -notmatch "Build Config") {
            throw "Packaged noctty.com +version did not print the expected version output."
          }
          if ($versionText -notmatch "custom shaders: enabled") {
            throw "Packaged noctty.com +version did not report custom shader support."
          }

          # The packaged ghostty-vt.dll is the placeholder: it fails to load
          # (ERROR_DLL_INIT_FAILED), exports nothing and names itself. The x64
          # portable smoke runs the same check (package-portable-cli.ps1).
          . ./scripts/ghostty-vt-stub.ps1
          $dllSmoke = Join-Path $env:RUNNER_TEMP 'test_dll_init.exe'
          zig cc test/windows/test_dll_init.c -lshell32 -lversion -o $dllSmoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged ARM64 DLL smoke compilation failed: $LASTEXITCODE" }
          & $dllSmoke (Join-Path $portableRoot 'ghostty-vt.dll') $GhosttyVtStubDescription
          if ($LASTEXITCODE -ne 0) { throw "Packaged ARM64 DLL smoke failed: $LASTEXITCODE" }

          $themesText = & $portableCommand +list-themes | Out-String
          if ($themesText -notmatch "0x96f") {
            throw "Packaged ARM64 +list-themes did not find packaged resources."
          }

  native-arm64:
    name: Native Windows ARM64 Tests
    needs: [changes, arm64-tests, arm64-build]
    # always(), not !cancelled(): under !cancelled() a cancelled run skips the
    # gate, and a skipped required check (the `main: CI gates` ruleset)
    # counts as passing. The gate runs anyway and fails on the cancelled jobs.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: scripts/ci-gate.ps1
          sparse-checkout-cone-mode: false

      - name: Every needed job succeeded and every skipped job was not needed
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./scripts/ci-gate.ps1 -NeedsJson $env:NEEDS_JSON -Expect arm64-tests:arm64_tests,arm64-build:arm64_build
