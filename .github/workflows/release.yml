name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package, without a leading v. Use the noctty fork scheme such as 1.3.100
        required: true
        type: string
      prerelease:
        description: Publish the manual build as a prerelease
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      WINGET_PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
      SCOOP_BUCKET_BRANCH: ${{ vars.SCOOP_BUCKET_BRANCH }}
      SCOOP_BUCKET_MANIFEST_PATH: ${{ vars.SCOOP_BUCKET_MANIFEST_PATH }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
      WINDOWS_CODESIGN_TRUST_SELF_SIGNED: ${{ vars.WINDOWS_CODESIGN_TRUST_SELF_SIGNED }}
      WINDOWS_CODESIGN_MIN_VALIDITY_DAYS: ${{ vars.WINDOWS_CODESIGN_MIN_VALIDITY_DAYS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require remote default-branch head
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $defaultBranch = $env:DEFAULT_BRANCH
          git fetch origin $defaultBranch --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch origin/$defaultBranch." }
          $current = (git rev-parse HEAD).Trim()
          $defaultHead = (git rev-parse "origin/$defaultBranch").Trim()
          if ($current -ne $defaultHead) {
            throw "Release SHA $current is not remote default-branch head $defaultHead."
          }
          if ($env:RELEASE_EVENT_NAME -eq "push") {
            $tagCommit = (git rev-list -n 1 $env:RELEASE_REF_NAME).Trim()
            if ($tagCommit -ne $defaultHead) {
              throw "Release tag does not point at remote default-branch head."
            }
          }
      - name: Require successful Test workflow for release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $runsJson = gh run list `
            --repo $env:GH_REPOSITORY `
            --workflow Test `
            --commit $sha `
            --status success `
            --limit 20 `
            --json databaseId,headSha,conclusion,status
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query Test workflow runs for $sha."
          }
          $runs = @($runsJson | ConvertFrom-Json)
          $matching = @($runs | Where-Object {
            $_.headSha -eq $sha -and $_.status -eq "completed" -and $_.conclusion -eq "success"
          })
          if ($matching.Count -eq 0) {
            throw "Release SHA $sha has no completed successful Test workflow run."
          }
          $evidenceRun = $null
          foreach ($run in $matching) {
            $jobs = gh api "repos/$env:GH_REPOSITORY/actions/runs/$($run.databaseId)/jobs?per_page=100" |
              ConvertFrom-Json
            $interactive = @($jobs.jobs | Where-Object {
              $_.name -eq 'Windows 11 Interactive Composite' -and $_.conclusion -eq 'success'
            })
            if ($interactive.Count -eq 0) { continue }

            $artifactName = "flagship-interactive-win11-$($run.databaseId)"
            $artifactRoot = Join-Path $env:RUNNER_TEMP "flagship-release-evidence-$($run.databaseId)"
            New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
            gh run download $run.databaseId --repo $env:GH_REPOSITORY --name $artifactName --dir $artifactRoot
            if ($LASTEXITCODE -ne 0) { continue }
            $resultFiles = @(
              Get-ChildItem -LiteralPath $artifactRoot -Filter result.json -File -Recurse |
                Where-Object {
                  try {
                    (Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json).scenario_id -eq 'windows.interactive-win11.composite'
                  }
                  catch { $false }
                }
            )
            if ($resultFiles.Count -ne 1) { continue }
            $resultPath = $resultFiles[0].FullName
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            if (@($result.artifacts).Count -eq 0) { continue }
            $artifactRootFull = [IO.Path]::GetFullPath($artifactRoot).TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
            $resultDir = Split-Path -Parent $resultPath
            $hashesBound = $true
            foreach ($artifact in @($result.artifacts)) {
              if (-not $artifact.sha256 -or -not $artifact.path) {
                $hashesBound = $false
                break
              }
              $artifactPath = [IO.Path]::GetFullPath((Join-Path $resultDir ([string]$artifact.path)))
              if (-not $artifactPath.StartsWith($artifactRootFull, [StringComparison]::OrdinalIgnoreCase) -or
                  -not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
                $hashesBound = $false
                break
              }
              $actualHash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne ([string]$artifact.sha256).ToLowerInvariant()) {
                $hashesBound = $false
                break
              }
            }
            if ($result.status -eq 'pass' -and
                $result.implementation_commit -eq $sha -and
                [string]$result.workflow_run_id -eq [string]$run.databaseId -and
                $hashesBound) {
              $evidenceRun = $run
              break
            }
          }
          if (-not $evidenceRun) {
            throw "Release SHA $sha has no successful interactive Win11 Test run with exact-SHA, hash-bound evidence. Dispatch Test with run_interactive_win11=true first."
          }
          Write-Host "Release SHA $sha is covered by interactive Test run $($evidenceRun.databaseId)."

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_PRERELEASE_INPUT: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          if ($env:RELEASE_EVENT_NAME -eq "push") {
            $tag = $env:RELEASE_REF_NAME
            $version = $tag.TrimStart('v')
            $prerelease = "false"
          } else {
            $version = $env:RELEASE_VERSION_INPUT
            $tag = "v$version"
            $prerelease = $env:RELEASE_PRERELEASE_INPUT
          }

          $versionMatch = [regex]::Match($version, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
          if (-not $versionMatch.Success) {
            throw "Unsupported release version format '$version'. noctty releases must use plain semver <major>.<minor>.<patch>."
          }

          $releaseMetaPath = Join-Path $PWD "dist/windows/release-metadata.json"
          if (-not (Test-Path -LiteralPath $releaseMetaPath)) {
            throw "Release metadata file not found: $releaseMetaPath"
          }

          $releaseMeta = Get-Content -LiteralPath $releaseMetaPath -Raw | ConvertFrom-Json
          $upstreamBaseVersion = [string]$releaseMeta.upstreamBaseVersion
          $firstForkPatch = [int]$releaseMeta.firstForkPatch
          $upstreamMatch = [regex]::Match($upstreamBaseVersion, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
          if (-not $upstreamMatch.Success) {
            throw "dist/windows/release-metadata.json must declare a plain semver upstreamBaseVersion."
          }

          $versionLine = "$($versionMatch.Groups['major'].Value).$($versionMatch.Groups['minor'].Value)"
          $upstreamLine = "$($upstreamMatch.Groups['major'].Value).$($upstreamMatch.Groups['minor'].Value)"
          if ($versionLine -ne $upstreamLine) {
            throw "Release version '$version' is on line $versionLine but upstreamBaseVersion '$upstreamBaseVersion' is on line $upstreamLine."
          }

          $patch = [int]$versionMatch.Groups['patch'].Value
          if ($patch -lt $firstForkPatch) {
            throw "Release patch '$patch' is below the configured firstForkPatch '$firstForkPatch'. noctty fork releases on line $versionLine must start at $versionLine.$firstForkPatch or later."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "title=noctty $version" >> $env:GITHUB_OUTPUT
          "version_line=$versionLine" >> $env:GITHUB_OUTPUT
          "upstream_base_version=$upstreamBaseVersion" >> $env:GITHUB_OUTPUT
          "first_fork_patch=$firstForkPatch" >> $env:GITHUB_OUTPUT

      - name: Release preflight
        uses: ./.github/actions/release-preflight
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        with:
          version: ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          require-package-managers: "true"
          github-token: ${{ github.token }}
          scoop-bucket-token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          wingetcreate-token: ${{ secrets.WINGETCREATE_TOKEN }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Run full test suite
        shell: pwsh
        run: zig build test -Demit-test-exe=true

      - name: Run native Win32 compositor tests
        shell: pwsh
        run: zig test src/apprt/win32_compositor_native.zig -lc -luser32 -lkernel32

      - name: Build and package x64 release artifacts
        shell: pwsh
        timeout-minutes: 35
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: >
          ./scripts/build-package-windows.ps1
          -Version $env:RELEASE_VERSION
          -Architecture x64
          -Optimize ReleaseFast
          -RequireInstaller
          -RequireSigning

      - name: Build and package ARM64 release artifacts
        shell: pwsh
        timeout-minutes: 35
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
        run: >
          ./scripts/build-package-windows.ps1
          -Version $env:RELEASE_VERSION
          -Architecture arm64
          -Optimize ReleaseFast
          -RequireInstaller
          -RequireSigning

      - name: Verify signed release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/release-verify-artifacts.ps1 -Version $env:RELEASE_VERSION

      - name: Scan Windows release artifacts with Microsoft Defender
        shell: pwsh
        timeout-minutes: 10
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/release-scan-defender.ps1 -Version $env:RELEASE_VERSION

      - name: Prepare build provenance attestation
        id: attestation_guard
        shell: pwsh
        env:
          ATTEST_REPOSITORY: ${{ github.repository }}
          ATTEST_SERVER_URL: ${{ github.server_url }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ($env:ATTEST_REPOSITORY -ne "amanthanvi/noctty" -or
              $env:ATTEST_SERVER_URL -ne "https://github.com") {
            throw "Release publication is restricted to amanthanvi/noctty on https://github.com."
          }
          if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or
              -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            throw "Cannot attest the canonical GitHub release without an OIDC request URL and token."
          }

          . (Join-Path $PWD "scripts/windows-architecture.ps1")
          $artifactDirX64 = Join-Path $PWD "dist/artifacts/noctty-$env:RELEASE_VERSION-windows-x64"
          $checksumsPath = Join-Path $artifactDirX64 (New-WindowsPackageArtifactName -Version $env:RELEASE_VERSION -Architecture x64 -Kind checksums)
          $legacyChecksumsPath = Join-Path $artifactDirX64 (New-WindowsPackageArtifactName -Version $env:RELEASE_VERSION -Architecture x64 -Kind legacy-checksums)
          Copy-Item -LiteralPath $checksumsPath -Destination $legacyChecksumsPath -Force
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest published release artifacts
        if: steps.attestation_guard.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-x64/noctty-${{ steps.meta.outputs.version }}-windows-x64-setup.exe
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-x64/noctty-${{ steps.meta.outputs.version }}-windows-x64-portable.zip
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-x64/noctty-${{ steps.meta.outputs.version }}-windows-x64-portable.manifest.ps1
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-x64/SHA256SUMS-windows-x64.txt
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-arm64/noctty-${{ steps.meta.outputs.version }}-windows-arm64-setup.exe
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-arm64/noctty-${{ steps.meta.outputs.version }}-windows-arm64-portable.zip
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-arm64/noctty-${{ steps.meta.outputs.version }}-windows-arm64-portable.manifest.ps1
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-arm64/SHA256SUMS-windows-arm64.txt
            dist/artifacts/noctty-${{ steps.meta.outputs.version }}-windows-x64/SHA256SUMS.txt

      - name: Generate package manager metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_UPSTREAM_BASE_VERSION: ${{ steps.meta.outputs.upstream_base_version }}
          RELEASE_FIRST_FORK_PATCH: ${{ steps.meta.outputs.first_fork_patch }}
        run: >
          ./scripts/package-package-managers.ps1
          -Version $env:RELEASE_VERSION
          -Tag $env:RELEASE_TAG
          -Repo $env:RELEASE_REPOSITORY
          -Architectures @("x64", "arm64")
          -UpstreamBaseVersion $env:RELEASE_UPSTREAM_BASE_VERSION
          -FirstForkPatch $env:RELEASE_FIRST_FORK_PATCH

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          RELEASE_VERSION_LINE: ${{ steps.meta.outputs.version_line }}
          RELEASE_UPSTREAM_BASE_VERSION: ${{ steps.meta.outputs.upstream_base_version }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: pwsh
        run: |
          ./scripts/release-publish-github.ps1 `
            -Tag $env:RELEASE_TAG `
            -Version $env:RELEASE_VERSION `
            -Title $env:RELEASE_TITLE `
            -VersionLine $env:RELEASE_VERSION_LINE `
            -UpstreamBaseVersion $env:RELEASE_UPSTREAM_BASE_VERSION `
            -Prerelease $env:RELEASE_PRERELEASE

      - name: Verify published release copy and assets
        if: steps.meta.outputs.prerelease != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/check-release-copy.ps1 -ExpectedVersion $env:RELEASE_VERSION -CheckRemoteLatest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-published-release.ps1 -Version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Scoop manifest
        if: steps.meta.outputs.prerelease != 'true'
        shell: pwsh
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/release-publish-scoop.ps1 -Version $env:RELEASE_VERSION

      - name: Submit WinGet manifest update
        if: steps.meta.outputs.prerelease != 'true'
        shell: pwsh
        timeout-minutes: 15
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/release-submit-winget.ps1 -Version $env:RELEASE_VERSION
