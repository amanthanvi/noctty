name: conpty-sync hang hunt against the fix (experiment, never merged)

on:
  push:
    branches: [experiment/conpty-sync-ci]

permissions:
  contents: read

jobs:
  hunt:
    name: ${{ matrix.mode }} ${{ matrix.replica }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: fixed, replica: 1, runs: 5 }
          - { mode: fixed, replica: 2, runs: 5 }
          - { mode: fixed, replica: 3, runs: 5 }
          - { mode: fixed, replica: 4, runs: 5 }
          - { mode: fixed, replica: 5, runs: 5 }
          - { mode: fixed, replica: 6, runs: 5 }
          - { mode: fixed, replica: 7, runs: 5 }
          - { mode: fixed, replica: 8, runs: 5 }
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Configure Zig package cache
        shell: pwsh
        run: '"ZIG_GLOBAL_CACHE_DIR=$env:GITHUB_WORKSPACE\.zig-global-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Cache Zig dependency packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}\.zig-global-cache/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.15.2-${{ github.job }}-packages-v1-${{ hashFiles('build.zig.zon', 'pkg/**/build.zig.zon') }}

      - name: Build native binaries
        shell: pwsh
        run: |
          zig build -Doptimize=ReleaseFast -Dcpu=baseline --summary all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Runner facts
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1)
          Write-Host "cpu: $($cpu.Name) logical=$($cpu.NumberOfLogicalProcessors)"

      - name: conpty-sync harness, sequential runs with a 300 s limit
        shell: pwsh
        continue-on-error: true
        run: |
          $results = @()
          foreach ($i in 1..${{ matrix.runs }}) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $log = "sync-run-$i.log"
            $env:NOCTTY_INTERACTIVE_WIN11_CONPTY_SYNC_BOOTSTRAPPED = '1'
            & $env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./test/windows/interactive-win11-conpty-sync.ps1 -NoBuild -RequireAll -ResetState -TimeoutSeconds 300 *>&1 | Tee-Object -FilePath $log | Select-Object -Last 8
            $code = $LASTEXITCODE
            $clock.Stop()
            $results += [pscustomobject]@{ run = $i; exit = $code; seconds = [math]::Round($clock.Elapsed.TotalSeconds, 1) }
            Write-Host "RUN $i exit=$code seconds=$([math]::Round($clock.Elapsed.TotalSeconds,1))"
          }
          $results | ConvertTo-Json | Set-Content sync-summary.json
          if (@($results | Where-Object exit -ne 0).Count) { exit 1 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hunt-${{ matrix.mode }}-${{ matrix.replica }}
          path: |
            sync-run-*.log
            sync-summary.json
          retention-days: 3
          if-no-files-found: warn
