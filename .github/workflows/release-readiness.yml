name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to validate, without a leading v. Use the winghostty fork scheme such as 1.3.100
        required: true
        type: string
      require_package_managers:
        description: Require official WinGet and Scoop manifest readiness
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: windows-latest
    environment: release
    env:
      WINGET_PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
      SCOOP_BUCKET_BRANCH: ${{ vars.SCOOP_BUCKET_BRANCH }}
      SCOOP_BUCKET_MANIFEST_PATH: ${{ vars.SCOOP_BUCKET_MANIFEST_PATH }}
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
      WINDOWS_CODESIGN_MIN_VALIDITY_DAYS: ${{ vars.WINDOWS_CODESIGN_MIN_VALIDITY_DAYS }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      WINGETCREATE_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release configuration
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          REQUIRE_PACKAGE_MANAGERS: ${{ inputs.require_package_managers }}
        shell: pwsh
        run: |
          $scriptArgs = @('-Version', $env:RELEASE_VERSION, '-RequireSigning', '-RequireAccessibilityEvidence')
          if ($env:REQUIRE_PACKAGE_MANAGERS -eq "true") {
            $scriptArgs += "-RequirePackageManagers"
          }
          ./scripts/check-release-copy.ps1 -ExpectedVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/release-preflight.ps1 @scriptArgs
