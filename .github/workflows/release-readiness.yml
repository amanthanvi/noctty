name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to validate, without a leading v. Use the noctty fork scheme such as 1.3.100
        required: true
        type: string
      require_package_managers:
        description: Require official WinGet and Scoop manifest readiness
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: windows-latest
    environment: release
    env:
      WINGET_PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
      SCOOP_BUCKET_BRANCH: ${{ vars.SCOOP_BUCKET_BRANCH }}
      SCOOP_BUCKET_MANIFEST_PATH: ${{ vars.SCOOP_BUCKET_MANIFEST_PATH }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
      WINDOWS_CODESIGN_TRUST_SELF_SIGNED: ${{ vars.WINDOWS_CODESIGN_TRUST_SELF_SIGNED }}
      WINDOWS_CODESIGN_MIN_VALIDITY_DAYS: ${{ vars.WINDOWS_CODESIGN_MIN_VALIDITY_DAYS }}
      # Azure Artifact Signing (ADR 0006) stays dormant until the release
      # environment defines all five; it signs through this job's GitHub OIDC
      # identity, so it needs no secret (docs/artifact-signing-runbook.md).
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
      ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      ARTIFACT_SIGNING_TENANT_ID: ${{ vars.ARTIFACT_SIGNING_TENANT_ID }}
      ARTIFACT_SIGNING_CLIENT_ID: ${{ vars.ARTIFACT_SIGNING_CLIENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release configuration
        uses: ./.github/actions/release-preflight
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        with:
          version: ${{ inputs.version }}
          prerelease: "false"
          require-package-managers: ${{ inputs.require_package_managers }}
          github-token: ${{ github.token }}
          scoop-bucket-token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          wingetcreate-token: ${{ secrets.WINGETCREATE_TOKEN }}
