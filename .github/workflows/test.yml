name: Test

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_interactive_win11:
        description: Run the full GUI suite on the interactive self-hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build And Tests
    # Pin the runner image for the headless performance regression floor. The
    # documented baseline remains machine-specific; this is not a cross-host
    # absolute comparison.
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Flagship verification contract checks
        shell: pwsh
        run: ./test/windows/flagship/Test-VerificationContracts.ps1

      - name: Site copy checks
        shell: pwsh
        run: ./scripts/check-site-copy.ps1

      - name: Release copy checks
        shell: pwsh
        run: ./scripts/check-release-copy.ps1

      - name: Release copy UTC date tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-release-copy-date.ps1

      - name: Release copy UTC date tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-release-copy-date.ps1

      - name: Remote release copy checks
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-copy.ps1 -CheckRemoteLatest

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - name: Deterministic site asset check
        shell: pwsh
        run: |
          node scripts/build-site-assets.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Site unit tests
        shell: pwsh
        run: |
          node --test "site/tests/**/*.test.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Signing trust policy tests
        shell: pwsh
        run: ./scripts/test-signing-trust.ps1

      - name: Windows build capability manifest tests
        shell: pwsh
        run: ./scripts/test-windows-build-capabilities.ps1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # Failed and cancelled jobs can save incomplete generated files.
          use-cache: false

      - name: Zig version
        run: zig version

      - name: Headless benchmark regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content test/windows/bench-evidence.schema.json -Raw | ConvertFrom-Json -Depth 100 | Out-Null
          zig build bench:vt-throughput -- --workload=ascii --bytes=4194304 --seed=121 --runs=5 --rows=45 --cols=140 --min-mb-s=50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build bench:vt-throughput -- --workload=utf8 --bytes=4194304 --seed=121 --runs=5 --rows=45 --cols=140 --min-mb-s=35
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build bench:vt-throughput -- --workload=osc --bytes=4194304 --seed=121 --runs=5 --rows=45 --cols=140 --min-mb-s=3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build bench:vt-throughput -- --workload=scroll --bytes=4194304 --seed=121 --runs=5 --rows=45 --cols=140 --min-mb-s=50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build bench:palette-match -- --entries=5000 --keystrokes=5000 --budget-us=1000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zig formatting
        shell: pwsh
        run: ./scripts/check-zig-format.ps1

      - name: PowerShell syntax and JSON validity
        shell: pwsh
        run: ./scripts/check-source-format.ps1

      - name: Full Zig test suite
        run: zig build test -Demit-test-exe=true

      - name: Custom shader compiler tests
        run: zig build test -Dtest-filter=shadertoy -Dcustom-shaders=true

      - name: Native Win32 compositor tests
        run: zig test src/apprt/win32_compositor_native.zig -lc -luser32 -lkernel32

      - name: Build executable
        # This traverses the default build graph too; a preceding plain
        # `zig build` duplicated the same Windows compile/link work.
        run: zig build -Demit-exe=true

      - name: Verify default source-build shader mode
        shell: pwsh
        run: |
          $versionText = & .\zig-out\bin\noctty.com +version | Out-String
          Write-Host $versionText
          if ($LASTEXITCODE -ne 0) {
            throw "noctty.com +version failed with exit code $LASTEXITCODE."
          }
          if ($versionText -notmatch "Build Config" -or
              $versionText -notmatch "custom shaders: disabled") {
            throw "Default source build did not report disabled custom shaders."
          }

      - name: Build ARM64 executable
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
        # Cross-compilation coverage only; native execution runs in windows-arm64.yml.
        run: zig build -Demit-exe=true -Dtarget=aarch64-windows-msvc -Dcpu=baseline

  windows-portable-smoke:
    name: Windows x64 Portable Package Smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Run portable package CLI smoke
        shell: pwsh
        run: ./test/windows/flagship/Invoke-PortableSmoke.ps1

      - name: Upload portable smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flagship-portable-x64-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test/windows/flagship/artifacts/portable-x64
            dist/artifacts/noctty-0.0.1-windows-x64

  windows-interactive:
    name: Windows 11 Interactive Composite
    # Dispatch-only: the interactive runner is registered ephemerally for
    # release validation, so no standing runner exists to serve queued jobs.
    # Dispatch Test with run_interactive_win11=true and arm the runner to
    # produce release evidence.
    if: github.event_name == 'workflow_dispatch' && inputs.run_interactive_win11
    runs-on: [self-hosted, Windows, X64, noctty-interactive]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # Ephemeral retries must start clean. setup-zig saves failed local
          # caches and otherwise restores the broken build runner on retry.
          use-cache: false

      - name: Prove interactive runner provenance
        shell: pwsh
        env:
          NOCTTY_EXPECTED_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./test/windows/assert-interactive-runner.ps1 -OutputPath "$env:RUNNER_TEMP/noctty-runner-provenance.json"

      - name: Run interactive Win11 composite
        shell: pwsh
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}\zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}\zig-local-cache
        run: |
          $ErrorActionPreference = 'Stop'
          $quick = '${{ github.event_name }}' -eq 'pull_request'
          if ($quick) {
            ./test/windows/interactive-win11-pr-smoke.ps1 -Rebuild -ResetState
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./test/windows/interactive-win11-shaders.ps1 -Rebuild -ResetState
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            ./test/windows/flagship/Invoke-InteractiveWin11.ps1 -Rebuild -ResetState -IncludeForegroundHarness
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./test/windows/interactive-win11-shaders.ps1 -Rebuild -ResetState
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./test/windows/interactive-win11-accessibility.ps1 -ResetState -TimeoutSeconds 120 -IdleSoakSeconds 600
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./test/windows/interactive-win11-palette-theme.ps1 -ResetState -ExerciseHighContrast
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./test/windows/interactive-win11-session-restore.ps1 -ResetState
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload interactive evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flagship-interactive-win11-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            test/windows/flagship/artifacts/interactive-win11
            ${{ github.workspace }}/.sandbox/win11/**/logs/**
            ${{ runner.temp }}/noctty-runner-provenance.json
