name: Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_interactive_win11:
        description: Run the full GUI suite on the interactive self-hosted runner
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build And Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Flagship verification contract checks
        shell: pwsh
        run: ./test/windows/flagship/Test-VerificationContracts.ps1

      - name: Site copy checks
        shell: pwsh
        run: ./scripts/check-site-copy.ps1

      - name: Release copy checks
        shell: pwsh
        # Keep CI local-only; manual release-copy validation uses -CheckRemoteLatest
        # to avoid making PR checks depend on GitHub release API availability.
        run: ./scripts/check-release-copy.ps1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Zig version
        run: zig version

      - name: Full Zig test suite
        run: zig build test -Demit-test-exe=true

      - name: Native Win32 compositor tests
        run: zig test src/apprt/win32_compositor_native.zig -lc -luser32 -lkernel32

      - name: Build
        run: zig build

      - name: Build executable
        run: zig build -Demit-exe=true

      - name: Build ARM64 executable
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
        # Cross-compilation coverage only; native execution runs in windows-arm64.yml.
        run: zig build -Demit-exe=true -Dtarget=aarch64-windows-msvc -Dcpu=baseline

  windows-portable-smoke:
    name: Windows x64 Portable Package Smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Run portable package CLI smoke
        shell: pwsh
        run: ./test/windows/flagship/Invoke-PortableSmoke.ps1

      - name: Upload portable smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flagship-portable-x64-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test/windows/flagship/artifacts/portable-x64
            dist/artifacts/winghostty-0.0.1-windows-x64

  windows-interactive:
    name: Windows 11 Interactive Composite
    if: github.event_name == 'workflow_dispatch' && inputs.run_interactive_win11
    runs-on: [self-hosted, Windows, X64, winghostty-interactive]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Run interactive Win11 composite
        shell: pwsh
        run: ./test/windows/flagship/Invoke-InteractiveWin11.ps1 -Rebuild -ResetState -IncludeForegroundHarness

      - name: Upload interactive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flagship-interactive-win11-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: test/windows/flagship/artifacts/interactive-win11
