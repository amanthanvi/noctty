# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_filters:
    - "!zig-out/**"
    - "!.zig-cache/**"
    - "!site/bundle.js"
    - "!site/package-lock.json"
    - "!site/icons/**/*.png"
    - "!dist/windows/**/*.zip"
    - "!dist/windows/**/*.msix"
    - "!dist/windows/**/*.png"
    - "!dist/windows/**/*.ico"
  path_instructions:
    - path: "site/**/*.jsx"
      instructions: |
        The static marketing site intentionally loads React and ReactDOM as UMD globals from site/vendor via site/index.html, then bundles only first-party JSX into site/bundle.js. Review source JSX rather than generated bundle output, and do not require ESM React imports unless the runtime loading model changes.
    - path: "site/index.html"
      instructions: |
        Google Fonts and manual bundle/style query-string cache busting are intentional for the static Cloudflare Pages deploy. Flag them only when the referenced assets or cache-bust values are stale or broken.
    - path: "site/components/install/**"
      instructions: |
        Install commands are guarded by scripts/check-site-copy.ps1. Do not replace the WinGet/Scoop command hierarchy when that check passes.
    - path: "site/components/hero/version-chip-color.jsx"
      instructions: |
        This is public static client code on Cloudflare Pages. Do not suggest embedding GitHub tokens in the browser; the intended release lookup behavior is unauthenticated fetch with sessionStorage caching, timeout, and explicit rate-limit bail-out.
    - path: "**/*.zig"
      instructions: |
        This repository is noctty, a Windows-focused Ghostty fork. Review against amanthanvi/noctty, not ghostty-org/ghostty. Do not suggest reintroducing the removed macos/ Xcode app or src/apprt/gtk runtime. Prefer minimal Zig changes, targeted `zig build test -Dtest-filter=<name>` validation, and `zig fmt` on touched Zig files.
    - path: "src/apprt/win32*.zig"
      instructions: |
        Win32 UI fixes should preserve child HWND invalidation, split-pane focus tracking, and repaint coalescing semantics documented in AGENTS.md. Flag stale paint, lifetime, and message-ordering regressions over stylistic nits.
  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
    yamllint:
      enabled: true

chat:
  auto_reply: true
